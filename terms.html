t replace professional medical advice, diagnosis or treatment.","Contact","← Back to GOAT"],"de":["GOAT Nutzungsbedingungen","GOAT unterstützt Training, Ernährung und Fortschrittsverfolgung. GOAT PRO ist über Abonnements im App Store verfügbar.","Abonnements","Abonnements verlängern sich gemäß den beim Kauf von Apple angezeigten Bedingungen. Verwaltung und Kündigung erfolgen über das Apple-Konto.","Gesundheitsinformationen","Die Inhalte dienen nur Informationszwecken und ersetzen keine professionelle medizinische Beratung, Diagnose oder Behandlung.","Kontakt","← Zurück zu GOAT"],"fr":["Conditions GOAT","GOAT accompagne l’entraînement, la nutrition et le suivi des progrès. Les fonctions GOAT PRO sont disponibles via des abonnements gérés par l’App Store.","Abonnements","Les abonnements se renouvellent selon les conditions affichées par Apple lors de l’achat. La gestion et l’annulation se font depuis le compte Apple.","Informations de santé","Le contenu est informatif et ne remplace pas un avis médical professionnel, un diagnostic ou un traitement.","Contact","← Retour à GOAT"],"it":["Termini GOAT","GOAT supporta allenamento, alimentazione e monitoraggio dei progressi. Le funzioni GOAT PRO sono disponibili tramite abbonamenti gestiti dall’App Store.","Abbonamenti","Gli abbonamenti si rinnovano secondo le condizioni mostrate da Apple durante l’acquisto. Gestione e cancellazione avvengono tramite l’account Apple.","Informazioni sulla salute","I contenuti sono informativi e non sostituiscono consulenza medica professionale, diagnosi o trattamento.","Contatti","← Torna a GOAT"],"es":["Términos de GOAT","GOAT apoya el entrenamiento, la nutrición y el seguimiento del progreso. Las funciones GOAT PRO están disponibles mediante suscripciones gestionadas por App Store.","Suscripciones","Las suscripciones se renuevan según las condiciones mostradas por Apple durante la compra. La gestión y cancelación se realizan desde la cuenta de Apple.","Información de salud","El contenido es informativo y no sustituye el consejo médico profesional, diagnóstico o tratamiento.","Contacto","← Volver a GOAT"],"pt":["Termos do GOAT","O GOAT apoia treino, nutrição e acompanhamento de progresso. Os recursos GOAT PRO estão disponíveis por assinaturas gerenciadas pela App Store.","Assinaturas","As assinaturas são renovadas conforme os termos mostrados pela Apple durante a compra. O gerenciamento e cancelamento são feitos pela conta Apple.","Informações de saúde","O conteúdo é informativo e não substitui orientação médica profissional, diagnóstico ou tratamento.","Contato","← Voltar ao GOAT"]};const l=document.querySelector("#lang");function a(c){if(!X[c])c="pl";document.documentElement.lang=c;localStorage.setItem("goatLang",c);document.querySelectorAll("[data-k]").forEach(e=>e.innerHTML=X[c][+e.dataset.k]);}const s=localStorage.getItem("goatLang")||"pl";l.value=s;a(s);l.onchange=e=>a(e.target.value);</script></body></html>
