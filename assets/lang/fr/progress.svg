<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220"><defs>
<filter id="brush" x="-25%" y="-30%" width="150%" height="170%">
 <feTurbulence type="fractalNoise" baseFrequency="0.018 0.12" numOctaves="2" seed="17" result="noise"/>
 <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" result="rough"/>
 <feDropShadow in="rough" dx="5" dy="7" stdDeviation="1.6" flood-color="#090000" flood-opacity="1"/>
 <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ff1238" flood-opacity=".34"/>
</filter>
<filter id="scratch"><feTurbulence type="fractalNoise" baseFrequency=".8 .08" numOctaves="1" seed="9" result="n"/><feComposite in="SourceGraphic" in2="n" operator="in"/></filter>
</defs><g transform="skewX(-8)" filter="url(#brush)"><text x="50%" y="127" text-anchor="middle" fill="#f7f7f7" stroke="#170006" stroke-width="13" paint-order="stroke fill" font-size="70" font-family="Impact, Haettenschweiler, Arial Narrow Bold, Arial Black, sans-serif" font-weight="900" font-style="italic" letter-spacing="-2">PROGRÈS</text><text x="50%" y="127" text-anchor="middle" fill="#f7f7f7" stroke="#f7f7f7" stroke-width="1.2" paint-order="stroke fill" font-size="70" font-family="Impact, Haettenschweiler, Arial Narrow Bold, Arial Black, sans-serif" font-weight="900" font-style="italic" letter-spacing="-2">PROGRÈS</text></g></svg>