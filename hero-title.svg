<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
<defs>
  <filter id="roughWhite" x="-15%" y="-25%" width="135%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.08" numOctaves="3" seed="17" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G" result="dist"/>
    <feTurbulence type="fractalNoise" baseFrequency=".5" numOctaves="2" seed="8" result="grain"/>
    <feComposite in="grain" in2="dist" operator="in" result="g"/>
    <feBlend in="dist" in2="g" mode="multiply"/>
  </filter>
  <filter id="roughRed" x="-15%" y="-25%" width="135%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.014 0.09" numOctaves="3" seed="29" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="21" xChannelSelector="R" yChannelSelector="G" result="dist"/>
    <feDropShadow dx="8" dy="9" stdDeviation="1.8" flood-color="#250000" flood-opacity=".9"/>
  </filter>
  <filter id="redGlow" x="-30%" y="-50%" width="160%" height="200%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
</defs>

